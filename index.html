<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online - Ratão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1e1f22; color: #dbdee1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-panel { background-color: #2b2d31; }
        .bg-input { background-color: #383a40; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center">

    <!-- Ecrã de Login -->
    <div id="login-screen" class="bg-panel p-8 rounded-lg shadow-lg w-96 flex flex-col gap-4">
        <h1 class="text-2xl font-bold text-white text-center mb-4">Bem-vindo</h1>
        <div>
            <label class="text-xs font-bold text-gray-400 uppercase">Nome de Utilizador</label>
            <input type="text" id="username-input" class="w-full bg-input text-white p-2 rounded mt-1 outline-none" placeholder="Ex: Emanuel">
        </div>
        <div id="password-container" class="hidden">
            <label class="text-xs font-bold text-gray-400 uppercase">Palavra-passe (Apenas Admin)</label>
            <input type="password" id="password-input" class="w-full bg-input text-white p-2 rounded mt-1 outline-none">
        </div>
        <button onclick="fazerLogin()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded mt-4 transition">
            Entrar no Chat
        </button>
    </div>

    <!-- Aplicação Principal -->
    <div id="main-app" class="hidden h-full w-full flex">
        
        <!-- Barra Lateral: Amigos e Admin -->
        <div class="w-64 bg-panel flex flex-col border-r border-gray-800">
            <div class="p-4 border-b border-gray-800 shadow-sm font-bold text-white">
                Chat Global
            </div>
            
            <div class="flex-1 overflow-y-auto p-2">
                <h3 class="text-xs font-bold text-gray-400 uppercase mb-2 ml-2 mt-4">Lista de Amigos</h3>
                <ul id="friends-list" class="space-y-1">
                    <!-- Amigos adicionados aparecerão aqui -->
                </ul>

                <!-- Painel de Administrador (Visível apenas para o Ratão) -->
                <div id="admin-panel" class="hidden mt-8 p-2 bg-red-900/20 rounded border border-red-800">
                    <h3 class="text-xs font-bold text-red-400 uppercase mb-2">Painel de Controlo (Admin)</h3>
                    <input type="text" id="announce-input" placeholder="Anúncio Global..." class="w-full bg-input text-sm p-1 rounded mb-2">
                    <button onclick="enviarAnuncio()" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-1 px-2 rounded mb-2">Enviar Anúncio</button>
                    
                    <input type="text" id="ban-input" placeholder="Nome do utilizador..." class="w-full bg-input text-sm p-1 rounded mb-2">
                    <div class="flex gap-1">
                        <button onclick="banir(24)" class="w-1/2 bg-orange-600 hover:bg-orange-700 text-white text-xs py-1 rounded">Ban 24h</button>
                        <button onclick="banir('permanente')" class="w-1/2 bg-red-800 hover:bg-red-900 text-white text-xs py-1 rounded">Ban Perm</button>
                    </div>
                </div>
            </div>

            <!-- Perfil do Utilizador (Fundo) -->
            <div class="bg-[#232428] p-3 flex items-center gap-3">
                <div id="my-avatar" class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold cursor-pointer" onclick="mudarAvatar()" title="Clique para mudar a cor">
                    ?
                </div>
                <div class="flex-1">
                    <div id="my-username" class="text-sm font-bold text-white"></div>
                    <div class="text-xs text-green-400">Online</div>
                </div>
            </div>
        </div>

        <!-- Área Central de Chat -->
        <div class="flex-1 flex flex-col bg-[#313338]">
            <!-- Banner de Anúncio -->
            <div id="global-announcement" class="hidden bg-indigo-600 text-white text-center p-2 font-bold shadow-md animate-pulse">
                <!-- Texto do anúncio -->
            </div>

            <!-- Mensagens -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- As mensagens carregam aqui -->
            </div>

            <!-- Input de Mensagem -->
            <div class="p-4">
                <div class="bg-input rounded-lg flex items-center p-2 px-4 shadow-sm">
                    <input type="text" id="message-input" class="bg-transparent flex-1 outline-none text-gray-200" placeholder="Conversar no #global" onkeypress="verificarEnter(event)">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        let isAdmin = false;
        let ws;

        // Mostrar campo de password se for o Ratão
        document.getElementById('username-input').addEventListener('input', function(e) {
            const val = e.target.value.trim().toLowerCase();
            const passContainer = document.getElementById('password-container');
            if (val === 'ratão' || val === 'ratao') {
                passContainer.classList.remove('hidden');
            } else {
                passContainer.classList.add('hidden');
                document.getElementById('password-input').value = "";
            }
        });

        function fazerLogin() {
            const user = document.getElementById('username-input').value.trim();
            const pass = document.getElementById('password-input').value;

            if (!user) return alert("Escreve um nome de utilizador!");

            // Verifica se está banido (simulação via localStorage)
            if (localStorage.getItem(`ban_${user}`)) {
                return alert("Esta conta está banida!");
            }

            if ((user.toLowerCase() === 'ratão' || user.toLowerCase() === 'ratao')) {
                if (pass === 'rataoadm123') {
                    isAdmin = true;
                } else {
                    return alert("Palavra-passe de admin incorreta!");
                }
            }

            currentUser = user;
            document.getElementById('my-username').innerText = currentUser;
            document.getElementById('my-avatar').innerText = currentUser.charAt(0).toUpperCase();
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            if (isAdmin) {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('my-username').innerHTML = `<span class="text-red-500">👑 ${currentUser}</span>`;
            }

            carregarAmigos();
            iniciarWebSocket();
        }

        function iniciarWebSocket() {
            // Liga ao servidor Node.js no Render
            const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(wsProtocol + window.location.host);

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'history') {
                    document.getElementById('chat-box').innerHTML = "";
                    message.data.forEach(msg => mostrarMensagem(msg.username, msg.text, msg.is_admin, msg.is_announcement));
                } else if (message.type === 'new_message') {
                    mostrarMensagem(message.data.username, message.data.text, message.data.is_admin, false);
                } else if (message.type === 'announcement') {
                    exibirAnuncioGlobal(message.text);
                }
            };

            ws.onerror = () => {
                mostrarMensagem("Sistema", "Estás em modo Offline. O servidor Render não está ligado.", false, false);
            };
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') enviarMensagem();
        }

        function enviarMensagem() {
            const input = document.getElementById('message-input');
            const texto = input.value.trim();
            if (!texto || !ws || ws.readyState !== WebSocket.OPEN) return;

            const msgData = {
                type: 'message',
                username: currentUser,
                text: texto,
                is_admin: isAdmin
            };

            ws.send(JSON.stringify(msgData));
            input.value = "";
        }

        function mostrarMensagem(user, texto, adminBadge, isSystem) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex gap-4 hover:bg-[#2b2d31] p-1 rounded transition group";
            
            const color = adminBadge ? 'bg-red-500' : 'bg-indigo-500';
            const nameColor = adminBadge ? 'text-red-400' : 'text-indigo-400';
            
            msgDiv.innerHTML = `
                <div class="w-10 h-10 rounded-full ${color} flex items-center justify-center text-white font-bold cursor-pointer" onclick="adicionarAmigo('${user}')">
                    ${user.charAt(0).toUpperCase()}
                </div>
                <div>
                    <div class="flex items-baseline gap-2">
                        <span class="font-bold ${nameColor} cursor-pointer hover:underline" onclick="adicionarAmigo('${user}')">${user}</span>
                        ${adminBadge ? '<span class="text-[10px] bg-red-600 text-white px-1 rounded">ADMIN</span>' : ''}
                    </div>
                    <p class="text-gray-300 mt-1">${texto}</p>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- SISTEMA DE AMIGOS ---
        function adicionarAmigo(nome) {
            if (nome === currentUser) return;
            let amigos = JSON.parse(localStorage.getItem('amigos') || '[]');
            if (!amigos.includes(nome)) {
                if(confirm(`Queres adicionar ${nome} aos amigos?`)) {
                    amigos.push(nome);
                    localStorage.setItem('amigos', JSON.stringify(amigos));
                    carregarAmigos();
                }
            }
        }

        function carregarAmigos() {
            const lista = document.getElementById('friends-list');
            lista.innerHTML = "";
            let amigos = JSON.parse(localStorage.getItem('amigos') || '[]');
            amigos.forEach(amigo => {
                lista.innerHTML += `
                    <li class="flex items-center gap-2 p-2 hover:bg-[#383a40] rounded cursor-pointer text-sm text-gray-300">
                        <div class="w-6 h-6 rounded-full bg-gray-600 flex items-center justify-center text-xs text-white">${amigo.charAt(0).toUpperCase()}</div>
                        ${amigo}
                    </li>
                `;
            });
        }

        // --- FUNÇÕES DE ADMIN (Ratão) ---
        function enviarAnuncio() {
            if (!isAdmin) return;
            const texto = document.getElementById('announce-input').value.trim();
            if (texto && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'announcement', text: texto }));
                document.getElementById('announce-input').value = "";
            }
        }

        function exibirAnuncioGlobal(texto) {
            const banner = document.getElementById('global-announcement');
            banner.innerText = `📢 ANÚNCIO GLOBAL: ${texto}`;
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 10000);
        }

        function banir(tempo) {
            if (!isAdmin) return;
            const alvo = document.getElementById('ban-input').value.trim();
            if (alvo) {
                // Num ambiente real, isto seria enviado para o backend. 
                // Aqui simulamos marcando no localStorage para impedir o login noutros browsers na mesma máquina para testes.
                localStorage.setItem(`ban_${alvo}`, tempo);
                alert(`O utilizador ${alvo} foi banido (${tempo === 24 ? '24 horas' : 'Permanente'}).`);
                document.getElementById('ban-input').value = "";
            }
        }

        function mudarAvatar() {
            const cores = ['bg-indigo-500', 'bg-green-500', 'bg-red-500', 'bg-yellow-500', 'bg-pink-500'];
            const avatar = document.getElementById('my-avatar');
            let corAtual = cores.find(c => avatar.classList.contains(c));
            let index = (cores.indexOf(corAtual) + 1) % cores.length;
            avatar.classList.remove(...cores);
            avatar.classList.add(cores[index]);
        }
    </script>
</body>
</html>
